name: Verify Pondok

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/cloudflare-d1-api]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build frontend and Worker bundle
        run: npm run build
